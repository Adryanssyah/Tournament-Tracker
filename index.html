  function playerById(id){
    for (var i = 0; i < state.players.length; i++) if (state.players[i].id === id) return state.players[i];
    return {name:'?', color:'#999'};
  }

  function renderMatchesPanel(){
    var panel = el('div', {class:'panel'});
    var head = el('div', {class:'panel-head'});
    head.appendChild(el('h2', {}, ['Match Schedule']));

    var filters = el('div', {class:'filters'});
    ['all','pending','completed'].forEach(function(f){
      var label = f === 'all' ? 'All' : (f === 'pending' ? 'Pending' : 'Completed');
      var btn = el('button', {class: state.filter === f ? 'active' : '', onclick:function(){
        state.filter = f; render();
      }}, [label]);
      filters.appendChild(btn);
    });
    head.appendChild(filters);
    panel.appendChild(head);

    var visibleIds = {};
    state.matches.forEach(function(m){
      if (state.filter === 'all' || m.status === state.filter) visibleIds[m.id] = true;
    });

    var scroll = el('div', {class:'matches-scroll'});
    var groups = groupMatchesByPhase(state.matches);
    var anyVisible = false;

    groups.forEach(function(g){
      var visibleInPhase = g.matches.filter(function(m){ return visibleIds[m.id]; });
      if (visibleInPhase.length === 0) return;
      anyVisible = true;

      var participants = phaseParticipantCount(g.matches);
      var completedInPhase = g.matches.filter(function(m){ return m.status === 'completed'; }).length;
      var isComplete = completedInPhase === g.matches.length;

      var header = el('div', {class:'phase-header'});
      header.appendChild(el('div', {class:'phase-title'}, ['PHASE ' + g.phase]));
      header.appendChild(el('div', {class:'phase-status' + (isComplete ? ' complete' : '')}, [
        isComplete ? 'Completed · ' + participants + '/' + state.players.length + ' players participated'
                   : participants + '/' + state.players.length + ' players participated · ' + completedInPhase + '/' + g.matches.length + ' played'
      ]));
      scroll.appendChild(header);

      var grid = el('div', {class:'match-grid'});
      visibleInPhase.forEach(function(m){ grid.appendChild(renderMatchCard(m)); });
      scroll.appendChild(grid);
    });

    if (!anyVisible){
      scroll.appendChild(el('div', {class:'empty-state'}, [
        el('div', {class:'big'}, ['🏸']),
        el('div', {}, ['No matches to show here.'])
      ]));
    }

    panel.appendChild(scroll);
    return panel;
  }

  function teamChip(playerIds, sideClass){
    var block = el('div', {class:'team-block ' + sideClass});
    playerIds.forEach(function(pid){
      var p = playerById(pid);
      var chip = el('div', {class:'player-chip'});
      chip.appendChild(el('span', {class:'dot', style:'background:' + p.color + ';'}));
      chip.appendChild(el('span', {}, [p.name]));
      block.appendChild(chip);
    });
    return block;
  }

  function renderMatchCard(m){
    var card = el('div', {class:'match-card' + (m.status === 'completed' ? ' completed' : '')});

    var head = el('div', {class:'match-card-head'});
    head.appendChild(el('div', {class:'match-num'}, ['MATCH ' + m.matchNumber]));
    head.appendChild(el('div', {class:'status-pill ' + m.status}, [m.status === 'completed' ? 'Completed' : 'Pending']));
    card.appendChild(head);

    var teamsRow = el('div', {class:'teams-row'});
    teamsRow.appendChild(teamChip(m.team1, 'team1'));
    teamsRow.appendChild(el('div', {class:'vs-mark'}, ['VS']));
    teamsRow.appendChild(teamChip(m.team2, 'team2'));
    card.appendChild(teamsRow);

    var s1Val = m.score1 === null || m.score1 === undefined ? '' : m.score1;
    var s2Val = m.score2 === null || m.score2 === undefined ? '' : m.score2;
    var t1Winner = m.status === 'completed' && Number(m.score1) > Number(m.score2);
    var t2Winner = m.status === 'completed' && Number(m.score2) > Number(m.score1);

    var scoreRow = el('div', {class:'score-row'});
    var leftBox = el('div', {class:'score-box left'});
    var input1 = el('input', {type:'number', min:'0', class:'score-input' + (t1Winner ? ' winner' : ''), placeholder:'—'});
    input1.value = s1Val;
    leftBox.appendChild(input1);
    scoreRow.appendChild(leftBox);
    scoreRow.appendChild(el('div', {class:'dash'}, ['–']));
    var rightBox = el('div', {class:'score-box right'});
    var input2 = el('input', {type:'number', min:'0', class:'score-input' + (t2Winner ? ' winner' : ''), placeholder:'—'});
    input2.value = s2Val;
    rightBox.appendChild(input2);
    scoreRow.appendChild(rightBox);
    card.appendChild(scoreRow);

    var actions = el('div', {class:'match-actions'});
    if (m.status === 'completed'){
      actions.appendChild(el('button', {class:'btn btn-outline btn-sm', onclick:function(){
        m.score1 = null; m.score2 = null; m.status = 'pending';
        render();
      }}, ['Edit Score']));
    } else {
      actions.appendChild(el('button', {class:'btn btn-primary btn-sm', onclick:function(){
        var v1 = input1.value.trim(), v2 = input2.value.trim();
        if (v1 === '' || v2 === '' || isNaN(Number(v1)) || isNaN(Number(v2))){
          showToast('Enter both scores to save');
          return;
        }
        if (Number(v1) === Number(v2)){
          showToast("Badminton matches can't end in a tie");
          return;
        }
        m.score1 = Number(v1); m.score2 = Number(v2); m.status = 'completed';
        render();
        showToast('Match ' + m.matchNumber + ' saved');
      }}, ['Save Score']));
    }
    card.appendChild(actions);

    return card;
  }

  function renderFairnessPanel(){
    var wrap = el('div', {class:'fairness-panel'});
    wrap.appendChild(el('h2', {style:'font-size:15px;margin:0 0 10px;font-weight:700;'}, ['Scheduling Fairness']));

    var stats = computeFairnessStats();
    var allEqual = stats.every(function(s){ return s.total === stats[0].total; });
    if (allEqual && stats.length){
      wrap.appendChild(el('div', {class:'fairness-badge'}, ['✓ Every player plays ' + stats[0].total + ' matches']));
    }

    var table = el('table', {class:'fairness-table'});
    var thead = el('thead', {});
    var headerCells = [
      el('th', {}, ['Player']),
      el('th', {class:'num'}, ['Matches']),
      el('th', {class:'num'}, ['Max Streak'])
    ];
    if (state.mode === '2v2') headerCells.push(el('th', {class:'num'}, ['Teammates']));
    thead.appendChild(el('tr', {}, headerCells));
    table.appendChild(thead);

    var tbody = el('tbody', {});
    stats.forEach(function(s){
      var cells = [
        el('td', {}, [
          el('div', {class:'player-name-cell'}, [
            el('span', {class:'dot', style:'background:' + s.color + ';'}),
            el('span', {}, [s.name])
          ])
        ]),
        el('td', {class:'num'}, [String(s.total)]),
        el('td', {class:'num' + (s.maxStreak >= 3 ? ' streak-warn' : '')}, [String(s.maxStreak)])

      tbody.appendChild(el('tr', {}, cells));

  function renderManagerModal(){
    var backdrop = el('div', {class:'modal-backdrop', onclick:function(e){
      if (e.target === backdrop){ managerOpen = false; render(); }
    }});
    var card = el('div', {class:'modal-card wide'});

    var head = el('div', {class:'manager-head'});
    head.appendChild(el('h3', {}, ['📂 Saved Tournaments']));
    head.appendChild(el('button', {class:'btn btn-ghost btn-sm', onclick:function(){ managerOpen = false; render(); }}, ['✕ Close']));
    card.appendChild(head);

    var records = loadAllTournamentRecords().sort(function(a, b){
      return new Date(b.updatedAt || 0) - new Date(a.updatedAt || 0);
    });

    if (!records.length){
      card.appendChild(el('div', {class:'manager-empty'}, [
        el('div', {style:'font-size:32px;margin-bottom:8px;'}, ['🏸']),
        el('div', {}, ['No saved tournaments yet — generate one to get started.'])
      ]));
    } else {
      var list = el('div', {class:'manager-list'});
      records.forEach(function(r){
        var total = r.matches.length;
        var completed = r.matches.filter(function(m){ return m.status === 'completed'; }).length;
        var pct = total ? Math.round(completed / total * 100) : 0;
        var statusCls = completed === 0 ? 'idle' : completed < total ? 'progress' : 'done';
        var statusLbl = completed === 0 ? 'Not Started' : completed < total ? 'In Progress' : 'Completed';
        var isActive = r.id === state.id;

        var itemEl = el('div', {class:'manager-item'});
        var top = el('div', {class:'manager-item-top'});
        var nameWrap = el('div', {});
        nameWrap.appendChild(el('span', {class:'manager-item-name'}, [r.name || 'Untitled Tournament']));
        if (isActive) nameWrap.appendChild(el('span', {class:'tourney-card-active-tag'}, ['ACTIVE']));
        top.appendChild(nameWrap);
        top.appendChild(el('span', {class:'manager-item-status ' + statusCls}, [statusLbl]));
        itemEl.appendChild(top);

        itemEl.appendChild(el('div', {class:'manager-item-meta'}, [
          (r.mode === '1v1' ? 'Singles' : 'Doubles') + ' · ' + r.players.length + ' players — ' +
          completed + ' / ' + total + ' matches completed (' + pct + '%) · Updated ' + (relativeDate(r.updatedAt) || '—')
        ]));

        var actionsRow = el('div', {class:'manager-item-actions'});
        actionsRow.appendChild(el('button', {class:'btn btn-primary btn-sm', onclick:function(){ openTournament(r.id); }}, ['Open']));
        actionsRow.appendChild(el('button', {class:'btn btn-outline btn-sm', onclick:function(){ renameSavedTournament(r.id); }}, ['Rename']));
        actionsRow.appendChild(el('button', {class:'btn btn-outline btn-sm', onclick:function(){ duplicatePromptId = r.id; render(); }}, ['Duplicate']));
        actionsRow.appendChild(el('button', {class:'btn btn-outline btn-sm', onclick:function(){ exportRecordFile(r); }}, ['Export']));
        actionsRow.appendChild(el('button', {class:'btn btn-danger-outline btn-sm', onclick:function(){ deleteSavedTournament(r.id, r.name || 'this tournament'); }}, ['Delete']));
        itemEl.appendChild(actionsRow);

        list.appendChild(itemEl);
      });
      card.appendChild(list);
    }

    var foot = el('div', {class:'manager-foot'});
    foot.appendChild(el('button', {class:'btn btn-outline btn-sm', onclick:triggerImportFile}, ['⬆ Import Tournament']));
    foot.appendChild(el('button', {class:'btn btn-outline btn-sm', onclick:exportAllTournaments}, ['🗄 Export All']));
    card.appendChild(foot);

    backdrop.appendChild(card);
    return backdrop;
  }

  ============================================================ */
  function renderImportPreviewModal(){
    var backdrop = el('div', {class:'modal-backdrop', onclick:function(e){
      if (e.target === backdrop){ importPreview = null; render(); }
    }});
    var card = el('div', {class:'modal-card'});

    if (importPreview.kind === 'backup'){
      var records = importPreview.records;
      card.appendChild(el('h3', {}, ['Import backup?']));
      card.appendChild(el('p', {}, ['This backup contains ' + records.length + ' tournament' + (records.length === 1 ? '' : 's') + '. They\u2019ll be added to your saved tournaments as new entries — nothing existing will be overwritten.']));
      var list = el('div', {class:'import-preview-list'});
      records.slice(0, 6).forEach(function(t){
        var completed = t.matches.filter(function(m){ return m.status === 'completed'; }).length;
        list.appendChild(el('div', {class:'import-preview-item'}, [
          el('b', {}, [t.name]),
          (t.mode === '1v1' ? 'Singles' : 'Doubles') + ' · ' + t.players.length + ' players · ' + completed + '/' + t.matches.length + ' completed'
        ]));
      });
      if (records.length > 6) list.appendChild(el('div', {class:'import-preview-item'}, ['+ ' + (records.length - 6) + ' more…']));
      card.appendChild(list);
    } else {
      var t = importPreview.record;
      var completed = t.matches.filter(function(m){ return m.status === 'completed'; }).length;
      var pct = t.matches.length ? Math.round(completed / t.matches.length * 100) : 0;
      card.appendChild(el('h3', {}, ['Import this tournament?']));
      card.appendChild(el('p', {}, ['It will be saved as a new tournament on this device. Your existing tournaments won\u2019t be changed.']));
      var summary = el('div', {class:'import-summary'});
      summary.appendChild(el('div', {class:'import-row'}, [el('span', {class:'import-label'}, ['Name']), el('span', {class:'import-value'}, [t.name])]));
      summary.appendChild(el('div', {class:'import-row'}, [el('span', {class:'import-label'}, ['Mode']), el('span', {class:'import-value'}, [t.mode === '1v1' ? 'Singles' : 'Doubles'])]));
      summary.appendChild(el('div', {class:'import-row'}, [el('span', {class:'import-label'}, ['Players']), el('span', {class:'import-value'}, [String(t.players.length)])]));
      summary.appendChild(el('div', {class:'import-row'}, [el('span', {class:'import-label'}, ['Matches']), el('span', {class:'import-value'}, [String(t.matches.length)])]));
      summary.appendChild(el('div', {class:'import-row'}, [el('span', {class:'import-label'}, ['Completed']), el('span', {class:'import-value'}, [completed + ' / ' + t.matches.length + ' (' + pct + '%)'])]));
      card.appendChild(summary);
    }

    var actions = el('div', {class:'modal-actions'});
    actions.appendChild(el('button', {class:'btn btn-ghost', onclick:function(){ importPreview = null; render(); }}, ['Cancel']));
    actions.appendChild(el('button', {class:'btn btn-primary', onclick:function(){
      if (importPreview.kind === 'backup'){
        importPreview.records.forEach(function(t){
          t.id = generateId();
          saveTournamentRecord(t);
        });
        var count = importPreview.records.length;
        importPreview = null;
        managerOpen = true;
        render();
        showToast('Imported ' + count + ' tournament' + (count === 1 ? '' : 's'));
      } else {
        var t2 = importPreview.record;
        t2.id = generateId();
        saveTournamentRecord(t2);
        importPreview = null;
        openTournament(t2.id);
      }
    }}, ['Import']));
    card.appendChild(actions);

    backdrop.appendChild(card);
    return backdrop;
  }

      var rec = duplicateTournament(id, true);
      render();
      if (rec) showToast('Duplicated "' + rec.name + '" with scores');
    }}, ['Duplicate with Scores']));
    card.appendChild(actions);
    backdrop.appendChild(card);
    return backdrop;
  }

  /* ============================================================
     CONFIRM MODAL
  ============================================================ */
  function confirmAction(opts){
    pendingAction = opts;
    render();
  }

  function renderConfirmModal(){
    var opts = pendingAction;
    var backdrop = el('div', {class:'modal-backdrop', onclick:function(e){
      if (e.target === backdrop){ pendingAction = null; render(); }
    }});
    var card = el('div', {class:'modal-card'});
    card.appendChild(el('h3', {}, [opts.title]));
    card.appendChild(el('p', {}, [opts.body]));
    var actions = el('div', {class:'modal-actions'});
    actions.appendChild(el('button', {class:'btn btn-ghost', onclick:function(){
      pendingAction = null; render();
    }}, ['Cancel']));
    actions.appendChild(el('button', {class:'btn btn-primary', onclick:function(){
      var fn = opts.onConfirm;
      pendingAction = null;
      fn();
    }}, [opts.confirmLabel]));
    card.appendChild(actions);
    backdrop.appendChild(card);
    return backdrop;
  }

  /* ============================================================
     INIT
  ============================================================ */
  initApp();

})();
</script>
</body>
</html>
