  function renameSavedTournament(id){
    var record = loadTournamentRecord(id);
    if (!record) return;
    var name = prompt('Tournament name', record.name);
    if (name === null) return;
    name = name.trim();
    if (!name) return;
    record.name = name;
    record.updatedAt = new Date().toISOString();
    saveTournamentRecord(record);
    if (state.id === id) state.name = name;
    render();
  }

  function duplicateTournament(id, keepScores){
    var record = loadTournamentRecord(id);
    if (!record) return null;
    var now = new Date().toISOString();
    var newRecord = {
      id: generateId(),
      name: record.name + (keepScores ? ' (Copy)' : ' (New Session)'),
      createdAt: now,
      updatedAt: now,
      formatVersion: FORMAT_VERSION,
      type: record.type || 'draw',
      mode: record.mode,
      players: record.players.map(function(p){ return {id:p.id, name:p.name, color:p.color}; }),
      teams: (record.teams || []).map(function(t){ return {id:t.id, playerIds:t.playerIds.slice(), color:t.color}; }),
      matches: (record.matches || []).map(function(m){
        var copy = {};
        for (var k in m) copy[k] = m[k];
        if (!keepScores){ copy.score1 = null; copy.score2 = null; copy.status = 'pending'; }
        return copy;
      }),
      bracket: null
    };
    if (record.bracket){
      // Duplicating without scores rebuilds a fresh match tree from the same
      // Round-1 slot layout (Requirement #21): bracket structure/colors preserved,
      // results/progression/champion state reset.
      if (keepScores){
        newRecord.bracket = {
          slotCount: record.bracket.slotCount, byes: record.bracket.byes, rounds: record.bracket.rounds,
          configMode: record.bracket.configMode,
          matches: record.bracket.matches.map(function(m){ var c = {}; for (var k in m) c[k] = m[k]; return c; })
        };
      } else {
        var slots = new Array(record.bracket.slotCount).fill(null);
        record.bracket.matches.filter(function(m){ return m.round === 0; }).forEach(function(m){
          slots[m.position*2] = m.competitor1; slots[m.position*2+1] = m.competitor2;
        });
        newRecord.bracket = {
          slotCount: record.bracket.slotCount, byes: record.bracket.byes, rounds: record.bracket.rounds,
          configMode: record.bracket.configMode, matches: buildBracketMatches(slots)
        };
      }
    }
    saveTournamentRecord(newRecord);
    return newRecord;
  }

  function deleteSavedTournament(id, name){
    confirmAction({
      title: 'Delete "' + name + '"?',
      body: 'This permanently removes this tournament from this device. This cannot be undone.',
      confirmLabel: 'Delete',
      onConfirm: function(){
        deleteTournamentRecordById(id);
        if (state.id === id){
          setActiveTournamentId(null);
          state = freshState();
        }
        render();
        showToast('Tournament deleted');
      }
    });
  }

  function relativeDate(iso){
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    var now = new Date();
    if (d.toDateString() === now.toDateString()) return 'Today ' + d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    var yesterday = new Date(now); yesterday.setDate(now.getDate() - 1);
    if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';
    return d.toLocaleDateString();
  }

  /* ============================================================
     FILE EXPORT / IMPORT
  ============================================================ */
  function toFilenameSegment(str){
    return (str || 'Tournament').toString().trim()
      .replace(/[–—]/g, '-')
      .replace(/[^a-zA-Z0-9\s-]+/g, '')
      .replace(/\s+/g, '-')
      .replace(/-+/g, '-')
      .replace(/^-+|-+$/g, '');
  }
  function isoDateStamp(d){
    d = d || new Date();
    return d.toISOString().slice(0, 10);
  }
  function downloadTextFile(filename, mimeType, content){
    var blob = new Blob([content], {type: mimeType});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }
  function downloadImageBlob(blob, filename){
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    showToast('Image downloaded');
  }

  function exportRecordFile(record){
    var payload = {app: APP_ID, formatVersion: FORMAT_VERSION, exportedAt: new Date().toISOString(), tournament: record};
    var filename = 'Shuttle-Draw-' + toFilenameSegment(record.name) + '-' + isoDateStamp() + '.json';
    downloadTextFile(filename, 'application/json', JSON.stringify(payload, null, 2));
    showToast('Tournament exported successfully.');
  }

  function exportActiveTournament(){
    if (!state.id){ showToast('Generate a tournament first'); return; }
    exportRecordFile(stateToRecord());
  }

  function exportAllTournaments(){
    var records = loadAllTournamentRecords();
    if (!records.length){ showToast('No saved tournaments to back up'); return; }
    var payload = {app: APP_ID, formatVersion: FORMAT_VERSION, exportedAt: new Date().toISOString(), type: 'backup', tournaments: records};
    var filename = 'shuttle-draw-backup-' + isoDateStamp() + '.json';
    downloadTextFile(filename, 'application/json', JSON.stringify(payload, null, 2));
    showToast('Backup exported — ' + records.length + ' tournament' + (records.length === 1 ? '' : 's'));
  }

  function validateTournamentPayload(t){
    if (!t || typeof t !== 'object') return 'Missing tournament data';
    if (t.mode !== '1v1' && t.mode !== '2v2') return 'Unrecognized game mode';
    if (!Array.isArray(t.players) || t.players.length < 2) return 'Player list is missing or invalid';
    for (var i = 0; i < t.players.length; i++){
      var p = t.players[i];
      if (!p || (typeof p.id !== 'string' && typeof p.id !== 'number') || typeof p.name !== 'string' || typeof p.color !== 'string'){
        return 'A player entry is invalid';
      }
    }
    var type = t.type || 'draw';
    if (type === 'tourney'){
      var b = t.bracket;
      if (!b || !Array.isArray(b.matches) || !b.slotCount) return 'Tournament bracket data is missing or invalid';
      if (t.mode === '2v2' && !Array.isArray(t.teams)) return 'Team list is missing or invalid';
      for (var k = 0; k < b.matches.length; k++){
        var bm = b.matches[k];
        if (!bm || typeof bm.id !== 'string' || typeof bm.round !== 'number' || !bm.status) return 'A bracket match entry is invalid';
      }
      return null;
    }
    if (!Array.isArray(t.matches)) return 'Match list is missing or invalid';
    for (var j = 0; j < t.matches.length; j++){
      var m = t.matches[j];
      if (!m || !Array.isArray(m.team1) || !Array.isArray(m.team2) || !m.team1.length || !m.team2.length){
        return 'A match entry is invalid';
      }
      if (m.score1 !== null && m.score1 !== undefined && typeof m.score1 !== 'number') return 'A match score is invalid';
      if (m.score2 !== null && m.score2 !== undefined && typeof m.score2 !== 'number') return 'A match score is invalid';
    }
    return null;
  }

  function migrateTournamentRecord(t){
    // Room to translate older format versions forward.
    return {
      id: null, // assigned fresh on import to avoid colliding with an existing tournament
      name: (t.name && String(t.name).trim()) || defaultTournamentName(),
      createdAt: t.createdAt || new Date().toISOString(),
      updatedAt: t.updatedAt || new Date().toISOString(),
      formatVersion: FORMAT_VERSION,
      type: t.type || 'draw',
      mode: t.mode,
      players: t.players,
      matches: t.matches || [],
      teams: t.teams || [],
      bracket: t.bracket || null
    };
  }

  function triggerImportFile(){
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json,.json';
    input.style.display = 'none';
    input.addEventListener('change', function(){
      var file = input.files && input.files[0];
      if (file){
        var reader = new FileReader();
        reader.onload = function(){ handleImportedFileContent(reader.result); };
        reader.onerror = function(){ showToast('Could not read that file'); };
        reader.readAsText(file);
      }
      if (input.parentNode) input.parentNode.removeChild(input);
    });
    document.body.appendChild(input);
    input.click();
  }

  function handleImportedFileContent(text){
    var parsed;
    try{ parsed = JSON.parse(text); }
    catch(e){ showToast('That file is not valid JSON'); return; }

    if (!parsed || typeof parsed !== 'object' || parsed.app !== APP_ID){
      showToast('That file is not a Shuttle Draw export'); return;
    }
    if (typeof parsed.formatVersion !== 'number' || parsed.formatVersion > FORMAT_VERSION){
      showToast('This file was created by a newer version of Shuttle Draw and can\u2019t be opened here'); return;
    }

    if (Array.isArray(parsed.tournaments)){
      var records = [];
      parsed.tournaments.forEach(function(t){
        if (!validateTournamentPayload(t)) records.push(migrateTournamentRecord(t));
      });
      if (!records.length){ showToast('No valid tournaments found in that backup file'); return; }
      importPreview = {kind: 'backup', records: records};
      render();
      return;
    }

    var err = validateTournamentPayload(parsed.tournament);
    if (err){ showToast('Invalid tournament file: ' + err); return; }
    importPreview = {kind: 'single', record: migrateTournamentRecord(parsed.tournament)};
    render();
  }

  /* ============================================================
     STANDINGS (always recomputed fresh from current match scores)
  ============================================================ */
  function computeStandings(players, matches){
    players = players || state.players;
    matches = matches || state.matches;
    var stats = {};
    players.forEach(function(p){
      stats[p.id] = {
        id:p.id, name:p.name, color:p.color,
        played:0, wins:0, losses:0, scored:0, conceded:0
      };
    });

    var completed = matches.filter(function(m){ return m.status === 'completed' && m.score1 !== null && m.score2 !== null; });

    completed.forEach(function(m){
      var s1 = Number(m.score1), s2 = Number(m.score2);
      var t1Win = s1 > s2;
      var t2Win = s2 > s1;
      m.team1.forEach(function(pid){
        var st = stats[pid]; if (!st) return;
        st.played++; st.scored += s1; st.conceded += s2;
        if (t1Win) st.wins++; else if (t2Win) st.losses++;
      });
      m.team2.forEach(function(pid){
        var st = stats[pid]; if (!st) return;
        st.played++; st.scored += s2; st.conceded += s1;
        if (t2Win) st.wins++; else if (t1Win) st.losses++;
      });
    });

    var list = Object.keys(stats).map(function(k){
      var s = stats[k];
      s.diff = s.scored - s.conceded;
      return s;
    });

    // head-to-head helper: for two players, how many completed matches did they
    // oppose each other in, and who won more of those
    function headToHeadWinner(aId, bId){
      var aWins = 0, bWins = 0;
      completed.forEach(function(m){
        var aInT1 = m.team1.indexOf(aId) !== -1, aInT2 = m.team2.indexOf(aId) !== -1;
        var bInT1 = m.team1.indexOf(bId) !== -1, bInT2 = m.team2.indexOf(bId) !== -1;
        var opposed = (aInT1 && bInT2) || (aInT2 && bInT1);
        if (!opposed) return;
        var s1 = Number(m.score1), s2 = Number(m.score2);
        if (aInT1){
          if (s1 > s2) aWins++; else if (s2 > s1) bWins++;
        } else {
          if (s2 > s1) aWins++; else if (s1 > s2) bWins++;
        }
      });
      if (aWins > bWins) return -1;
      if (bWins > aWins) return 1;
      return 0;
    }

    list.sort(function(a, b){
      if (b.wins !== a.wins) return b.wins - a.wins;
      if (b.diff !== a.diff) return b.diff - a.diff;
      if (b.scored !== a.scored) return b.scored - a.scored;
      var h2h = headToHeadWinner(a.id, b.id);
      if (h2h !== 0) return h2h;
      return a.name.localeCompare(b.name);
    });

    return list;
  }

  /* ============================================================
     PHASE + FAIRNESS HELPERS
  ============================================================ */
  function groupMatchesByPhase(matches){
    var byPhase = {};
    var order = [];
    matches.forEach(function(m){
      var ph = m.phase || 1;
      if (!byPhase[ph]){ byPhase[ph] = {phase: ph, matches: []}; order.push(ph); }
      byPhase[ph].matches.push(m);
    });
    order.sort(function(a, b){ return a - b; });
    return order.map(function(ph){ return byPhase[ph]; });
  }

  function phaseParticipantCount(phaseMatches){
    var seen = {};
    phaseMatches.forEach(function(m){
      m.team1.concat(m.team2).forEach(function(p){ seen[p] = true; });
    });
    return Object.keys(seen).length;
  }

  function currentPhaseInfo(){
    var groups = groupMatchesByPhase(state.matches);
    for (var i = 0; i < groups.length; i++){
      var g = groups[i];
      var completed = g.matches.filter(function(m){ return m.status === 'completed'; }).length;
      if (completed < g.matches.length){
        return {phase: g.phase, completed: completed, total: g.matches.length, totalPhases: groups.length};
      }
    }
    if (groups.length){
      var last = groups[groups.length - 1];
      return {phase: last.phase, completed: last.matches.length, total: last.matches.length, totalPhases: groups.length};
    }
    return {phase: 0, completed: 0, total: 0, totalPhases: 0};
  }

  // Scans the schedule in fixed order (independent of scores) to surface how the
  // draw itself is balanced: total appearances, longest back-to-back run, and
  // (for doubles) how many distinct teammates each player was paired with.
  function computeFairnessStats(players, matches, mode){
    players = players || state.players;
    matches = matches || state.matches;
    mode = mode || state.mode;
    var byPlayer = {};
    players.forEach(function(p){
      byPlayer[p.id] = {id:p.id, name:p.name, color:p.color, total:0, maxStreak:0, curStreak:0, teammateSet:{}};
    });
    var ordered = matches.slice().sort(function(a, b){ return a.matchNumber - b.matchNumber; });
    ordered.forEach(function(m){
      var involved = {};
      m.team1.concat(m.team2).forEach(function(p){ involved[p] = true; });
      players.forEach(function(p){
        var rec = byPlayer[p.id];
        if (involved[p.id]){
          rec.total++;
          rec.curStreak++;
          if (rec.curStreak > rec.maxStreak) rec.maxStreak = rec.curStreak;
        } else {
          rec.curStreak = 0;
        }
      });
      if (mode === '2v2'){
        byPlayer[m.team1[0]].teammateSet[m.team1[1]] = true;
        byPlayer[m.team1[1]].teammateSet[m.team1[0]] = true;
        byPlayer[m.team2[0]].teammateSet[m.team2[1]] = true;
        byPlayer[m.team2[1]].teammateSet[m.team2[0]] = true;
      }
    });
    return players.map(function(p){
      var rec = byPlayer[p.id];
      return {
        id: p.id, name: p.name, color: p.color,
        total: rec.total, maxStreak: rec.maxStreak,
        teammates: Object.keys(rec.teammateSet).length
      };
    });
  }

  /* ============================================================
     REPORTING: highlights, partnerships, head-to-head
     (shared by the share-image canvas and the static HTML report)
  ============================================================ */
  function computeHighlights(players, matches){
    var completed = matches.filter(function(m){ return m.status === 'completed'; });
    if (!completed.length) return null;
    var standings = computeStandings(players, matches);
    function topBy(key){ return standings.slice().sort(function(a,b){ return b[key]-a[key]; })[0]; }
    var bestSingleMatch = null, bestSingleScore = -1;
    completed.forEach(function(m){
      var hi = Math.max(Number(m.score1), Number(m.score2));
      if (hi > bestSingleScore){ bestSingleScore = hi; bestSingleMatch = m; }
    });
    return {
      champion: standings[0],
      mostWins: topBy('wins'),
      bestDiff: topBy('diff'),
      mostPlayed: topBy('played'),
      highestScorer: topBy('scored'),
      bestSingleMatch: bestSingleMatch,
      bestSingleScore: bestSingleScore
    };
  }

  function computePartnershipStats(players, matches){
    var byId = {}; players.forEach(function(p){ byId[p.id] = p; });
    var pairs = {};
    matches.filter(function(m){ return m.status === 'completed'; }).forEach(function(m){
      [m.team1, m.team2].forEach(function(team){
        var key = team.slice().sort().join(',');
        if (!pairs[key]) pairs[key] = {ids: team.slice(), played: 0, wins: 0, losses: 0};
        var rec = pairs[key];
        rec.played++;
        var s1 = Number(m.score1), s2 = Number(m.score2);
        var won = (team === m.team1) ? s1 > s2 : s2 > s1;
        if (won) rec.wins++; else rec.losses++;
      });
    });
    var list = Object.keys(pairs).map(function(k){
      var r = pairs[k];
      return {
        players: r.ids.map(function(id){ return byId[id] || {name:'?', color:'#999'}; }),
        played: r.played, wins: r.wins, losses: r.losses,
        winRate: r.played ? Math.round(r.wins / r.played * 100) : 0
      };
    });
    list.sort(function(a, b){ return b.played - a.played || b.winRate - a.winRate; });
    return list;
  }

  function computeHeadToHeadStats(players, matches){
    var byId = {}; players.forEach(function(p){ byId[p.id] = p; });
    var pairs = {};
    matches.filter(function(m){ return m.status === 'completed'; }).forEach(function(m){
      var s1 = Number(m.score1), s2 = Number(m.score2);
      m.team1.forEach(function(a){
        m.team2.forEach(function(b){
          var key = [a, b].sort().join(',');
          if (!pairs[key]) pairs[key] = {ids: [a, b].sort(), aWins: 0, bWins: 0, count: 0};
          var rec = pairs[key];
          rec.count++;
          var aIsFirst = rec.ids[0] === a;
          var aScore = aIsFirst ? s1 : s2, bScore = aIsFirst ? s2 : s1;
          if (aScore > bScore) rec.aWins++; else rec.bWins++;
        });
      });
    });
    return Object.keys(pairs).map(function(k){
      var r = pairs[k];
      return {a: byId[r.ids[0]] || {name:'?'}, b: byId[r.ids[1]] || {name:'?'}, count: r.count, aWins: r.aWins, bWins: r.bWins};
    }).sort(function(x, y){ return y.count - x.count; });
  }

  /* ============================================================
     RENDER HELPERS
  ============================================================ */
  var root = document.getElementById('root');
  function el(tag, attrs, children){
    var node = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function(k){
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return; // skip falsy attrs (e.g. disabled:null must NOT set the attribute)
      if (k === 'class') node.className = v;
      else if (k === 'html') node.innerHTML = v;
      else if (k.indexOf('on') === 0 && typeof v === 'function') node.addEventListener(k.slice(2), v);
      else if (k === 'style') node.setAttribute('style', v);
      else node.setAttribute(k, v === true ? '' : v);
    });
    (children || []).forEach(function(c){
      if (c === null || c === undefined) return;
      if (typeof c === 'string') node.appendChild(document.createTextNode(c));
      else node.appendChild(c);
    });
    return node;
  }

  function logoSvg(){
    return '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">' +
      '<circle cx="9" cy="15" r="5.2" stroke="white" stroke-width="1.6"/>' +
      '<path d="M12.7 11.3L20 4M20 4l-1 4.5M20 4l-4.5 1" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>' +
      '</svg>';
  }

  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c];
    });
  }

  /* ============================================================
     SHARE: STATISTICS IMAGE (canvas, downloadable PNG / Web Share)
  ============================================================ */
  function canvasRoundRect(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }
  function fitCanvasText(ctx, text, maxWidth){
    text = String(text);
    if (ctx.measureText(text).width <= maxWidth) return text;
    var t = text;
    while (t.length > 1 && ctx.measureText(t + '\u2026').width > maxWidth){ t = t.slice(0, -1); }
    return t + '\u2026';
  }

  function generateStatsImageCanvas(){
    var W = 1080, H = 1350, pad = 64;
    var contentW = W - pad * 2;
    var canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    var ctx = canvas.getContext('2d');

    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#123524');
    grad.addColorStop(1, '#0D2A1B');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    var y = 96;

    // brand mark
    ctx.fillStyle = 'rgba(255,255,255,0.14)';
    canvasRoundRect(ctx, pad, y - 34, 46, 46, 13); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.arc(pad + 19, y - 12, 10, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(pad + 26, y - 19); ctx.lineTo(pad + 38, y - 31); ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.font = '700 24px Outfit, sans-serif';
    ctx.fillText('SHUTTLE DRAW', pad + 60, y - 6);

    ctx.textAlign = 'right';
    ctx.font = '500 18px Inter, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.68)';
    var dateStr = new Date().toLocaleDateString(undefined, {year:'numeric', month:'long', day:'numeric'});
    ctx.fillText(dateStr, W - pad, y - 6);
    ctx.textAlign = 'left';

    y += 66;
    ctx.fillStyle = '#fff';
    ctx.font = '700 44px Outfit, sans-serif';
    ctx.fillText(fitCanvasText(ctx, state.name || 'Tournament', contentW), pad, y);

    y += 34;
    var completedCount = state.matches.filter(function(m){ return m.status === 'completed'; }).length;
    var total = state.matches.length;
    var pct = total ? Math.round(completedCount / total * 100) : 0;
    ctx.font = '500 21px Inter, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.78)';
    ctx.fillText(
      (state.mode === '1v1' ? 'Singles' : 'Doubles') + '   \u00b7   ' + state.players.length + ' players   \u00b7   ' +
      completedCount + '/' + total + ' matches (' + pct + '%)',
      pad, y
    );

    y += 24;
    var barH = 12;
    ctx.fillStyle = 'rgba(255,255,255,0.16)';
    canvasRoundRect(ctx, pad, y, contentW, barH, 6); ctx.fill();
    ctx.fillStyle = '#D98E3B';
    canvasRoundRect(ctx, pad, y, Math.max(barH, contentW * pct / 100), barH, 6); ctx.fill();

    y += 48;

    var highlights = computeHighlights(state.players, state.matches);
    var items = [];
    if (highlights){
      items = [
        ['\uD83C\uDFC6 Champion', highlights.champion.name],
        ['\uD83D\uDD25 Most Wins', highlights.mostWins.name + ' (' + highlights.mostWins.wins + ')'],
        ['\uD83D\uDCC8 Best +/-', highlights.bestDiff.name + ' (' + (highlights.bestDiff.diff > 0 ? '+' : '') + highlights.bestDiff.diff + ')'],
        ['\uD83C\uDFAF Most Played', highlights.mostPlayed.name + ' (' + highlights.mostPlayed.played + ')'],
        ['\uD83D\uDCAF Highest Score', highlights.highestScorer.name + ' (' + highlights.highestScorer.scored + ' pts)'],
        highlights.bestSingleMatch ? ['\u26A1 Top Match', 'Match ' + highlights.bestSingleMatch.matchNumber + ' \u2014 ' + highlights.bestSingleScore + ' pts'] : null
      ].filter(Boolean);
    }
    if (items.length){
      var cols = 2, gap = 16;
      var cardW = (contentW - gap) / cols;
      var cardH = 78;
      items.forEach(function(item, idx){
        var cx = pad + (idx % cols) * (cardW + gap);
        var cy = y + Math.floor(idx / cols) * (cardH + gap);
        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        canvasRoundRect(ctx, cx, cy, cardW, cardH, 14); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.font = '600 14px Inter, sans-serif';
        ctx.fillText(item[0], cx + 18, cy + 28);
        ctx.fillStyle = '#fff';
        ctx.font = '700 20px Outfit, sans-serif';
        ctx.fillText(fitCanvasText(ctx, item[1], cardW - 36), cx + 18, cy + 56);
      });
      y += Math.ceil(items.length / cols) * (cardH + gap) + 10;
    } else {
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.font = '500 18px Inter, sans-serif';
      ctx.fillText('Highlights appear once matches are completed.', pad, y + 20);
      y += 50;
    }

    var standings = computeStandings(state.players, state.matches);
    var rowH = 44, headH = 40;
    var tableH = headH + rowH * standings.length + 20;
    ctx.fillStyle = '#F1F3EC';
    canvasRoundRect(ctx, pad, y, contentW, tableH, 18); ctx.fill();

    var colMP = pad + contentW - 300, colW = pad + contentW - 232, colL = pad + contentW - 172, colDiff = pad + contentW - 60;
    var tx = pad + 26, ty = y + 32;
    ctx.fillStyle = '#4B5D52';
    ctx.font = '700 13px Outfit, sans-serif';
    ctx.fillText('#', tx, ty);
    ctx.fillText('PLAYER', tx + 42, ty);
    ctx.textAlign = 'center';
    ctx.fillText('MP', colMP, ty);
    ctx.fillText('W', colW, ty);
    ctx.fillText('L', colL, ty);
    ctx.fillText('+/-', colDiff, ty);
    ctx.textAlign = 'left';

    ty += headH - 4;
    standings.forEach(function(s, idx){
      var rowY = ty + idx * rowH;
      if (idx < 3){
        ctx.fillStyle = idx === 0 ? 'rgba(217,142,59,0.16)' : idx === 1 ? 'rgba(91,107,133,0.12)' : 'rgba(217,142,59,0.07)';
        ctx.fillRect(pad + 10, rowY - 25, contentW - 20, rowH - 6);
      }
      ctx.fillStyle = '#152A1F';
      ctx.font = '700 16px Outfit, sans-serif';
      ctx.fillText(String(idx + 1), tx, rowY);

      ctx.beginPath(); ctx.fillStyle = s.color; ctx.arc(tx + 32, rowY - 5, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#152A1F';
      ctx.font = '600 16px Inter, sans-serif';
      ctx.fillText(fitCanvasText(ctx, s.name, contentW - 420), tx + 50, rowY);

      ctx.textAlign = 'center';
      ctx.font = '600 15px Inter, sans-serif';
      ctx.fillText(String(s.played), colMP, rowY);
      ctx.fillText(String(s.wins), colW, rowY);
      ctx.fillText(String(s.losses), colL, rowY);
      ctx.fillStyle = s.diff > 0 ? '#2F9E58' : s.diff < 0 ? '#C0453B' : '#4B5D52';
      ctx.font = '700 15px Inter, sans-serif';
      ctx.fillText((s.diff > 0 ? '+' : '') + s.diff, colDiff, rowY);
      ctx.textAlign = 'left';
    });

    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.font = '500 16px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('\uD83C\uDFF8 Generated with Shuttle Draw', W / 2, H - 40);
    ctx.textAlign = 'left';

    return canvas;
  }

  // Requirement #19: Tourney share image prioritizes a clean champion/runner-up
  // summary rather than cramming a 48-player bracket into a tiny social image.
  // Requirement #21/#22: the bracket is the star of the shared image. Canvas
  // size adapts to the bracket size so names stay readable even at 48 players
  // — small brackets get a tidy 1920x1080 card, large ones get a bigger canvas
  // (then are proportionally scaled to a shareable ceiling).
  function generateTourneyBracketImageCanvas(){
    var b = state.bracket;
    var CW = 250, CH = 108, ROWGAP = 26, COLGAP = 86;
    var PAD_TOP = 168, PAD_SIDE = 60, PAD_BOTTOM = 50;
    var P = CH + ROWGAP;
    var round0Count = b.slotCount / 2;

    var columns = b.rounds + 1; // + champion column
    var naturalW = PAD_SIDE * 2 + columns * CW + (columns - 1) * COLGAP;
    var naturalH = PAD_TOP + P * round0Count - ROWGAP + PAD_BOTTOM;

    var MAX_DIM = 2600;
    var scale = Math.min(1, MAX_DIM / naturalW, MAX_DIM / naturalH);
    var canvas = document.createElement('canvas');
    canvas.width = Math.round(naturalW * scale);
    canvas.height = Math.round(naturalH * scale);
    var ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);

    ctx.fillStyle = '#F7F3E9';
    ctx.fillRect(0, 0, naturalW, naturalH);

    ctx.fillStyle = '#1F3D2B';
    ctx.font = '700 20px Outfit, sans-serif';
    ctx.fillText('\uD83C\uDFC6 SHUTTLE DRAW \u00b7 TOURNAMENT BRACKET', PAD_SIDE, 42);
    ctx.font = '800 38px Outfit, sans-serif';
    ctx.fillText(fitCanvasText(ctx, state.name || 'Tournament', naturalW - PAD_SIDE * 2), PAD_SIDE, 88);
    ctx.font = '500 18px Inter, sans-serif';
    ctx.fillStyle = '#5B6B5E';
    var comps = getTourneyCompetitors();
    ctx.fillText((state.mode === '1v1' ? 'Singles' : 'Doubles') + '  \u00b7  ' + comps.length + (state.mode==='2v2'?' teams':' players') + '  \u00b7  ' + b.slotCount + '-slot bracket', PAD_SIDE, 118);

    function centerY(r, j){ return PAD_TOP + P * ((j + 0.5) * Math.pow(2, r) - 0.5) + CH / 2; }
    function colX(r){ return PAD_SIDE + r * (CW + COLGAP); }

    // connecting lines first (drawn underneath the cards)
    ctx.strokeStyle = '#C9C2B3'; ctx.lineWidth = 2.5;
    b.matches.forEach(function(m){
      if (!m.nextMatchId) return;
      var nm = null;
      for (var i = 0; i < b.matches.length; i++) if (b.matches[i].id === m.nextMatchId){ nm = b.matches[i]; break; }
      if (!nm) return;
      var x1 = colX(m.round) + CW, y1 = centerY(m.round, m.position);
      var x2 = colX(nm.round), y2 = centerY(nm.round, nm.position);
      var midX = (x1 + x2) / 2;
      ctx.strokeStyle = m.status === 'completed' || m.status === 'bye' ? '#D98E3B' : '#C9C2B3';
      ctx.beginPath();
      ctx.moveTo(x1, y1); ctx.lineTo(midX, y1); ctx.lineTo(midX, y2); ctx.lineTo(x2, y2);
      ctx.stroke();
    });
    // final -> champion connector
    var finalMatch = b.matches[b.matches.length - 1];
    var fx1 = colX(finalMatch.round) + CW, fy1 = centerY(finalMatch.round, finalMatch.position);
    var fx2 = colX(b.rounds), fy2 = PAD_TOP + (P * round0Count - ROWGAP) / 2;
    var fMid = (fx1 + fx2) / 2;
    ctx.strokeStyle = isTourneyChampionDecided() ? '#D98E3B' : '#C9C2B3';
    ctx.beginPath(); ctx.moveTo(fx1, fy1); ctx.lineTo(fMid, fy1); ctx.lineTo(fMid, fy2); ctx.lineTo(fx2, fy2); ctx.stroke();

    // round headers + match cards
    for (var r = 0; r < b.rounds; r++){
      var roundMatches = b.matches.filter(function(m){ return m.round === r; });
      var x = colX(r);
      ctx.fillStyle = '#1F3D2B';
      ctx.font = '800 15px Outfit, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(roundMatches[0].roundLabel.toUpperCase(), x + CW / 2, PAD_TOP - 16);
      ctx.textAlign = 'left';
      roundMatches.forEach(function(m){
        drawBracketCardOnCanvas(ctx, m, x, centerY(r, m.position) - CH / 2, CW, CH);
      });
    }
    // champion card
    ctx.fillStyle = '#1F3D2B';
    ctx.font = '800 15px Outfit, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('CHAMPION', fx2 + CW / 2, PAD_TOP - 16);
    ctx.textAlign = 'left';
    var champId = tourneyChampionId();
    var ccx = fx2, ccy = fy2 - CH / 2;
    canvasRoundRect(ctx, ccx, ccy, CW, CH, 14);
    ctx.fillStyle = champId ? '#FCEFDC' : '#FFFFFF';
    ctx.fill();
    ctx.strokeStyle = champId ? '#D98E3B' : '#DDD6C4';
    ctx.lineWidth = champId ? 2.5 : 1.5;
    ctx.stroke();
    ctx.textAlign = 'center';
    if (champId){
      var champ = competitorById(champId);
      ctx.font = '28px sans-serif';
      ctx.fillText('\uD83C\uDFC6', ccx + CW/2, ccy + 36);
      ctx.fillStyle = '#1F3D2B';
      ctx.font = '700 18px Outfit, sans-serif';
      ctx.fillText(fitCanvasText(ctx, champ.label, CW - 24), ccx + CW/2, ccy + 66);
      ctx.fillStyle = '#D98E3B';
      ctx.font = '800 12px Outfit, sans-serif';
      ctx.fillText('CHAMPION', ccx + CW/2, ccy + 86);
    } else {
      ctx.fillStyle = '#9A9280';
      ctx.font = 'italic 500 15px Inter, sans-serif';
      ctx.fillText('To be decided', ccx + CW/2, ccy + CH/2 + 5);
    }
    ctx.textAlign = 'left';
    return canvas;
  }

  function drawBracketCardOnCanvas(ctx, m, x, y, w, h){
    canvasRoundRect(ctx, x, y, w, h, 12);
    ctx.fillStyle = m.status === 'bye' ? '#EAF2EC' : '#FFFFFF';
    ctx.fill();
    ctx.strokeStyle = m.status === 'completed' ? '#C9E4D3' : (m.status === 'pending' ? '#D98E3B' : '#DDD6C4');
    ctx.lineWidth = m.status === 'pending' ? 2.2 : 1.4;
    ctx.stroke();

    var padX = 14;
    ctx.fillStyle = '#8A8271';
    ctx.font = '700 10.5px Inter, sans-serif';
    ctx.fillText('MATCH ' + (m.round+1) + '.' + (m.position+1), x + padX, y + 20);

    function row(compId, isWinner, score, yy){
      var comp = competitorById(compId);
      ctx.fillStyle = isWinner ? '#2F9E58' : '#1F2A22';
      ctx.font = (isWinner ? '700 ' : '600 ') + '15px Outfit, sans-serif';
      if (comp){
        ctx.beginPath(); ctx.arc(x + padX + 5, yy - 5, 5, 0, Math.PI*2); ctx.fillStyle = comp.color; ctx.fill();
        ctx.fillStyle = isWinner ? '#2F9E58' : '#1F2A22';
        ctx.fillText(fitCanvasText(ctx, comp.label, w - padX*2 - 44), x + padX + 16, yy);
      } else {
        ctx.fillStyle = '#9A9280'; ctx.font = 'italic 13px Inter, sans-serif';
        ctx.fillText('TBD', x + padX + 16, yy);
      }
      if (score !== null && score !== undefined){
        ctx.fillStyle = '#1F2A22'; ctx.font = '800 16px Outfit, sans-serif'; ctx.textAlign = 'right';
        ctx.fillText(String(score), x + w - padX, yy);
        ctx.textAlign = 'left';
      }
    }

    if (m.status === 'bye'){
      row(m.winner, true, null, y + 50);
      ctx.fillStyle = '#1F3D2B'; ctx.font = '700 12px Outfit, sans-serif';
      ctx.fillText('BYE \u2192 ADVANCES', x + padX, y + h - 14);
      return;
    }
    row(m.competitor1, m.status==='completed' && m.winner===m.competitor1, m.status==='completed'?m.score1:null, y + 42);
    row(m.competitor2, m.status==='completed' && m.winner===m.competitor2, m.status==='completed'?m.score2:null, y + 72);
    ctx.fillStyle = '#9A9280'; ctx.font = '600 10.5px Inter, sans-serif';
    var label = m.status === 'completed' ? '\u2713 COMPLETED' : (m.status === 'pending' ? '\u25CF READY' : 'WAITING');
    ctx.fillText(label, x + padX, y + h - 12);
  }

  function generateTourneyStatsImageCanvas(){
    var W = 1080, H = 1080, pad = 64;
    var contentW = W - pad * 2;
    var canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    var ctx = canvas.getContext('2d');
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#123524'); grad.addColorStop(1, '#0D2A1B');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);

    var y = 96;
    ctx.fillStyle = '#fff';
    ctx.font = '700 24px Outfit, sans-serif';
    ctx.fillText('\uD83C\uDFC6 SHUTTLE DRAW \u00b7 TOURNEY', pad, y - 6);

    y += 70;
    ctx.font = '700 46px Outfit, sans-serif';
    ctx.fillText(fitCanvasText(ctx, state.name || 'Tournament', contentW), pad, y);

    y += 32;
    var comps = getTourneyCompetitors();
    ctx.font = '500 20px Inter, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.fillText((state.mode === '1v1' ? 'Singles' : 'Doubles') + '  \u00b7  ' + comps.length + (state.mode==='2v2'?' teams':' players') + '  \u00b7  ' + state.bracket.slotCount + '-slot bracket', pad, y);

    y += 70;
    var champId = tourneyChampionId();
    var final = tourneyFinalMatch();
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    canvasRoundRect(ctx, pad, y, contentW, 190, 18); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.font = '600 16px Inter, sans-serif';
    ctx.fillText(champId ? 'CHAMPION' : 'IN PROGRESS', pad + 28, y + 40);
    ctx.fillStyle = '#D98E3B';
    ctx.font = '700 42px Outfit, sans-serif';
    ctx.fillText(fitCanvasText(ctx, champId ? competitorById(champId).label : (currentTourneyRoundLabel()), contentW - 56), pad + 28, y + 92);
    if (champId && final && final.status === 'completed'){
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.font = '600 16px Inter, sans-serif';
      ctx.fillText('RUNNER-UP', pad + 28, y + 132);
      ctx.fillStyle = '#fff';
      ctx.font = '700 24px Outfit, sans-serif';
      ctx.fillText(fitCanvasText(ctx, competitorById(final.loser).label + '   (Final: ' + final.score1 + '\u2013' + final.score2 + ')', contentW - 56), pad + 28, y + 164);
    }
    y += 190 + 40;

    var playable = state.bracket.matches.filter(function(m){ return m.status !== 'bye'; });
    var completedCount = playable.filter(function(m){ return m.status === 'completed'; }).length;
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.font = '500 18px Inter, sans-serif';
    ctx.fillText(completedCount + ' / ' + playable.length + ' matches played \u00b7 ' + state.bracket.byes + ' BYE' + (state.bracket.byes===1?'':'s'), pad, y);

    return canvas;
  }

  function openShareImageModal(mode){
    if (state.type === 'tourney'){
      if (!state.bracket){ showToast('Generate a tournament first'); return; }
      var canvas2 = mode === 'summary' ? generateTourneyStatsImageCanvas() : generateTourneyBracketImageCanvas();
      shareImageCanvasRef = canvas2;
      shareImageDataUrl = canvas2.toDataURL('image/png');

    var canvas = generateStatsImageCanvas();
    shareImageCanvasRef = canvas;
    shareImageDataUrl = canvas.toDataURL('image/png');
    shareImageModalOpen = true;
    render();
  }

    card.appendChild(grid);
    return card;
  }

  // Requirement #18: tournament report for Tourney mode — overview, bracket
  // summary, champion/runner-up, finish positions, stats, and round-by-round
  // results, built with the same report look-and-feel as the Draw report.
  // Requirement #23/#24: the report leads with the full bracket, not a
  // standings table. Absolute-positioned (no live measurement needed since
  // this HTML is static) but same layout math as the on-screen bracket.
  function buildStaticBracketHtml(){
    var b = state.bracket;
    var CW = 190, CARD_H = 128, GAP = 22, COLGAP = 56, PAD = 20, HEAD_H = 34;
    var P = CARD_H + GAP;
    var round0Count = b.slotCount / 2;
    var totalW = PAD * 2 + (b.rounds + 1) * CW + b.rounds * COLGAP;
    var totalH = HEAD_H + P * round0Count - GAP + PAD;

    function colX(r){ return PAD + r * (CW + COLGAP); }
    function centerY(r, j){ return HEAD_H + P * ((j + 0.5) * Math.pow(2, r) - 0.5) + CARD_H / 2; }

    var canvas = el('div', {class:'r-bracket-canvas', style:'width:' + totalW + 'px;height:' + totalH + 'px;'});

    function hLine(x, y, w, color){ return el('div', {style:'position:absolute;left:' + x + 'px;top:' + (y - 1) + 'px;width:' + Math.max(0,w) + 'px;height:2px;background:' + color + ';'}); }
    function vLine(x, y1, y2, color){ var top = Math.min(y1,y2), h = Math.abs(y2 - y1); return el('div', {style:'position:absolute;left:' + (x - 1) + 'px;top:' + top + 'px;width:2px;height:' + h + 'px;background:' + color + ';'}); }

    b.matches.forEach(function(m){
      if (!m.nextMatchId) return;
      var nm = null;
      for (var i = 0; i < b.matches.length; i++) if (b.matches[i].id === m.nextMatchId){ nm = b.matches[i]; break; }
      if (!nm) return;
      var x1 = colX(m.round) + CW, y1 = centerY(m.round, m.position);
      var x2 = colX(nm.round), y2 = centerY(nm.round, nm.position);
      var midX = (x1 + x2) / 2;
      var color = (m.status === 'completed' || m.status === 'bye') ? '#D98E3B' : '#C9C2B3';
      canvas.appendChild(hLine(x1, y1, midX - x1, color));
      canvas.appendChild(vLine(midX, y1, y2, color));
      canvas.appendChild(hLine(midX, y2, x2 - midX, color));
    });
    var finalMatch = b.matches[b.matches.length - 1];
    var fx1 = colX(finalMatch.round) + CW, fy1 = centerY(finalMatch.round, finalMatch.position);
    var fx2 = colX(b.rounds), fy2 = HEAD_H + (P * round0Count - GAP) / 2;
    var fMid = (fx1 + fx2) / 2;
    var fColor = isTourneyChampionDecided() ? '#D98E3B' : '#C9C2B3';
    canvas.appendChild(hLine(fx1, fy1, fMid - fx1, fColor));
    canvas.appendChild(vLine(fMid, fy1, fy2, fColor));
    canvas.appendChild(hLine(fMid, fy2, fx2 - fMid, fColor));

    for (var r = 0; r < b.rounds; r++){
      var roundMatches = b.matches.filter(function(m){ return m.round === r; });
      var label = el('div', {class:'r-bracket-round-label', style:'left:' + colX(r) + 'px;top:0;width:' + CW + 'px;'}, [roundMatches[0].roundLabel.toUpperCase()]);
      canvas.appendChild(label);
      roundMatches.forEach(function(m){
        var top = centerY(r, m.position) - CARD_H / 2;
        var card = el('div', {class:'r-bracket-card ' + m.status, style:'left:' + colX(r) + 'px;top:' + top + 'px;width:' + CW + 'px;height:' + CARD_H + 'px;'});
        card.appendChild(el('div', {class:'r-bracket-num'}, ['Match ' + (m.round+1) + '.' + (m.position+1)]));
        function compRow(compId, isWinner, score){
          var comp = competitorById(compId);
          var row = el('div', {class:'r-bracket-competitor' + (isWinner ? ' winner' : '')});
          if (comp){
            row.appendChild(el('span', {class:'r-dot', style:'background:' + comp.color + ';'}));
            row.appendChild(el('span', {}, [comp.label]));
          } else {
            row.appendChild(el('span', {style:'color:var(--ink-soft);font-style:italic;'}, ['TBD']));
          }
          if (score !== null && score !== undefined) row.appendChild(el('span', {class:'r-bracket-score'}, [String(score)]));
          return row;
        }
        if (m.status === 'bye'){
          card.appendChild(compRow(m.winner, true, null));
          card.appendChild(el('div', {class:'r-bracket-bye-line'}, ['BYE \u2192 ADVANCES']));
        } else {
          card.appendChild(compRow(m.competitor1, m.status==='completed' && m.winner===m.competitor1, m.status==='completed'?m.score1:null));
          card.appendChild(compRow(m.competitor2, m.status==='completed' && m.winner===m.competitor2, m.status==='completed'?m.score2:null));
        }
        canvas.appendChild(card);
      });
    }
    var champLabel = el('div', {class:'r-bracket-round-label', style:'left:' + fx2 + 'px;top:0;width:' + CW + 'px;'}, ['CHAMPION']);
    canvas.appendChild(champLabel);
    var champId = tourneyChampionId();
    var champBox = el('div', {class:'r-bracket-champion ' + (champId ? 'decided' : 'tbd'), style:'left:' + fx2 + 'px;top:' + (fy2 - CARD_H/2) + 'px;width:' + CW + 'px;height:' + CARD_H + 'px;'});
    if (champId){
      var champ = competitorById(champId);
      champBox.appendChild(el('div', {style:'font-size:22px;'}, ['\uD83C\uDFC6']));
      champBox.appendChild(el('div', {style:'font-weight:800;'}, [champ.label]));
    } else {
      champBox.appendChild(el('div', {}, ['To be decided']));
    }
    canvas.appendChild(champBox);

    var scroller = el('div', {class:'r-bracket-scroller'}, [canvas]);
    var section = el('section', {class:'r-bracket-section'});
    section.appendChild(el('h2', {}, ['Tournament Bracket']));
    section.appendChild(scroller);
    return section;
  }

  function buildTourneyReportDocument(){
    var comps = getTourneyCompetitors();
    var finish = computeTourneyFinish();
    var stats = computeTourneyStats();
    var b = state.bracket;
    var playable = b.matches.filter(function(m){ return m.status !== 'bye'; });
    var completed = playable.filter(function(m){ return m.status === 'completed'; });
    var champ = tourneyChampionId();
    var final = tourneyFinalMatch();

    var ranked = comps.slice().sort(function(a,b2){
      var order = {'Champion':0,'Runner-up':1};
      var ra = order.hasOwnProperty(finish[a.id]) ? order[finish[a.id]] : 50;
      var rb = order.hasOwnProperty(finish[b2.id]) ? order[finish[b2.id]] : 50;
      if (ra !== rb) return ra - rb;
      return (stats[b2.id].wins - stats[a.id].wins);
    });

    var container = el('div', {class:'report'});
    var header = el('header', {class:'r-header'});
    header.appendChild(el('div', {class:'r-brand'}, ['\uD83C\uDFC6 Shuttle Draw \u00b7 Tourney']));

    ]));

    // Requirement #23: bracket appears before the detailed statistics.
    container.appendChild(buildStaticBracketHtml());

    var overview = el('section', {class:'r-section'});

    var ogrid = el('div', {class:'r-stat-grid'});

    ogrid.appendChild(reportStat(b.byes, 'BYEs'));
    ogrid.appendChild(reportStat(b.rounds, 'Rounds'));
    ogrid.appendChild(reportStat(completed.length + ' / ' + playable.length, 'Matches Played'));
    overview.appendChild(ogrid);
    container.appendChild(overview);

    var hSec = el('section', {class:'r-section'});
    hSec.appendChild(el('h2', {}, ['Champion']));
    var hgrid = el('div', {class:'r-highlight-grid'});
    hgrid.appendChild(reportHighlight('\uD83C\uDFC6 Champion', champ ? competitorById(champ).label : 'Not yet decided'));
    if (final && final.status === 'completed'){
      hgrid.appendChild(reportHighlight('\uD83E\uDD48 Runner-up', competitorById(final.loser).label));
      hgrid.appendChild(reportHighlight('Final Score', final.score1 + ' \u2013 ' + final.score2));
    }
    hSec.appendChild(hgrid);
    container.appendChild(hSec);

    var sSec = el('section', {class:'r-section'});
    sSec.appendChild(el('h2', {}, ['Tournament Finish']));
    var table = el('table', {class:'r-table'});
    var thead = el('thead', {}, [el('tr', {}, [el('th',{},['#']), el('th',{},[state.mode==='2v2'?'Team':'Player']), el('th',{},['Finish']), el('th',{},['W-L']), el('th',{},['PF-PA'])])]);
    table.appendChild(thead);
    var tbody = el('tbody');
    ranked.forEach(function(c, i){
      var s = stats[c.id];
      tbody.appendChild(el('tr', {}, [
        el('td',{},[String(i+1)]),
        el('td',{}, [el('span', {class:'r-dot', style:'background:'+c.color+';'}), c.label]),
        el('td',{},[finish[c.id]]),
        el('td',{},[s.wins+'-'+s.losses]),
        el('td',{},[s.pf+'-'+s.pa])
      ]));
    });
    table.appendChild(tbody);
    sSec.appendChild(table);
    container.appendChild(sSec);

    var mSec = el('section', {class:'r-section'});
    mSec.appendChild(el('h2', {}, ['Round-by-Round Results']));
    if (!completed.length){
      mSec.appendChild(el('p', {class:'r-empty'}, ['No matches have been completed yet.']));
    } else {
      for (var r = 0; r < b.rounds; r++){
        var roundMatches = completed.filter(function(m){ return m.round === r; });
        if (!roundMatches.length) continue;
        mSec.appendChild(el('h3', {class:'r-phase-title'}, [roundMatches[0].roundLabel]));
        var mtable = el('table', {class:'r-table r-match-table'});

          mtbody.appendChild(el('tr', {}, [
            el('td', {class: m.winner===m.competitor1?'r-winner':''}, [c1.label]),
            el('td', {class:'r-score'}, [m.score1 + ' \u2013 ' + m.score2]),
            el('td', {class: m.winner===m.competitor2?'r-winner':''}, [c2.label])
          ]));
        });
        mtable.appendChild(mtbody);
        mSec.appendChild(mtable);
      }
    }
    container.appendChild(mSec);

    container.appendChild(el('footer', {class:'r-footer'}, ['Generated with Shuttle Draw \u00b7 ' + new Date().toLocaleString()]));

    return '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">' +

  function render(){
    root.innerHTML = '';
    scheduleSave();
    // The fixed-100vh "dashboard-mode" layout (internal scrolling panels) is
    // exclusively a Draw-mode concept. Tourney mode is bracket-first and uses
    // normal document flow / vertical page scrolling instead — never apply it there.
    var isDashboard = state.screen === 'dashboard' && state.type !== 'tourney';
    document.documentElement.classList.toggle('dashboard-mode', isDashboard);
    document.body.classList.toggle('dashboard-mode', isDashboard);

    if (state.screen === 'setup-type') root.appendChild(renderTypeScreen());
    else if (state.screen === 'setup-mode') root.appendChild(renderModeScreen());
    else if (state.screen === 'setup-count') root.appendChild(renderCountScreen());
    else if (state.screen === 'setup-players') root.appendChild(renderPlayersScreen());
    else if (state.screen === 'setup-bracket-choice') root.appendChild(renderBracketChoiceScreen());
    else if (state.screen === 'setup-bracket-editor') root.appendChild(renderBracketEditorScreen());
    else if (state.type === 'tourney') root.appendChild(renderTourneyDashboard());
    else root.appendChild(renderDashboard());

    if (managerOpen) root.appendChild(renderManagerModal());
    if (importPreview) root.appendChild(renderImportPreviewModal());
    if (shareImageModalOpen) root.appendChild(renderShareImageModal());
    if (duplicatePromptId) root.appendChild(renderDuplicateModal());
    if (pendingAction) root.appendChild(renderConfirmModal());
  }

        state.screen = 'setup-bracket-choice';
        render();

        state.players.forEach(function(p){ p.name = p.name.trim(); });

  /* ============================================================
     SETUP: MANUAL BRACKET EDITOR
  ============================================================ */
  var editorSelectedIdx = null;
  function renderBracketEditorScreen(){
    var slots = state.editorSlots;
    var comps = getTourneyCompetitors();
    var byId = {}; comps.forEach(function(c){ byId[c.id] = c; });

    var wrap = el('div', {class:'setup-wrap'});
    var card = el('div', {class:'setup-card', style:'max-width:820px;'});
    card.appendChild(brandBlock());
    card.appendChild(el('h2', {}, ['Set Round 1 matchups']));
    card.appendChild(el('p', {class:'setup-sub'}, ['Tap two slots to swap them. BYE slots are shown clearly — swap them around too if you want a different competitor to receive the bye.']));

    var err = validateSlots(slots, comps.map(function(c){ return c.id; }));
    if (err) card.appendChild(el('div', {class:'error-text'}, [err]));

    var grid = el('div', {class:'bracket-editor-grid'});
    var numPairs = slots.length / 2;
    for (var p = 0; p < numPairs; p++){
      var pairWrap = el('div', {class:'bracket-editor-pair'});
      [0,1].forEach(function(side){
        var slotIdx = p*2 + side;
        var compId = slots[slotIdx];
        var comp = compId !== null ? byId[compId] : null;
        var isSelected = editorSelectedIdx === slotIdx;
        var slotEl = el('div', {
          class: 'bracket-editor-slot' + (comp ? '' : ' bye') + (isSelected ? ' selected' : ''),
          onclick: (function(si){
            return function(){
              if (editorSelectedIdx === null){ editorSelectedIdx = si; render(); return; }
              if (editorSelectedIdx === si){ editorSelectedIdx = null; render(); return; }
              var tmp = slots[si]; slots[si] = slots[editorSelectedIdx]; slots[editorSelectedIdx] = tmp;
              editorSelectedIdx = null;
              render();
            };
          })(slotIdx)
        });
        if (comp) slotEl.appendChild(el('span', {class:'dot', style:'background:' + comp.color + ';'}));
        slotEl.appendChild(el('span', {}, [comp ? comp.label : 'BYE']));
        pairWrap.appendChild(slotEl);
      });
      grid.appendChild(pairWrap);
    }
    card.appendChild(grid);

    var actions = el('div', {class:'setup-actions'});
    actions.appendChild(el('button', {class:'btn btn-ghost', onclick:function(){
      state.editorSlots = null; editorSelectedIdx = null;
      state.screen = 'setup-bracket-choice'; render();
    }}, ['← Back']));
    var rightActions = el('div', {style:'display:flex;gap:10px;'});
    rightActions.appendChild(el('button', {class:'btn btn-outline btn-sm', onclick:function(){
      var comps2 = comps.map(function(c){ return c.id; });
      var skel = buildBracketSkeleton(comps2.length);
      state.editorSlots = assignSlotsRandom(comps2, skel.slotCount, skel.byes);
      editorSelectedIdx = null;
      render();
    }}, ['🎲 Randomize']));
    rightActions.appendChild(el('button', {class:'btn btn-outline btn-sm', onclick:function(){
      var comps3 = comps.map(function(c){ return c.id; });
      var skel3 = buildBracketSkeleton(comps3.length);
      state.editorSlots = assignSlotsRandom(comps3, skel3.slotCount, skel3.byes);
      editorSelectedIdx = null;
      render();
    }}, ['↺ Reset']));
    var confirmBtn = el('button', {class:'btn btn-primary', onclick:function(){
      editorSelectedIdx = null;
      actionConfirmManualBracket();
    }}, ['Confirm Bracket ✓']);
    if (err) confirmBtn.setAttribute('disabled', 'disabled');
    rightActions.appendChild(confirmBtn);
    actions.appendChild(rightActions);
    card.appendChild(actions);

    wrap.appendChild(card);
    return wrap;
  }

        state.filter = f; render();

    });

      if (state.filter === 'all' || m.status === state.filter) visibleIds[m.id] = true;
    });

    var scroll = el('div', {class:'matches-scroll'});
    var groups = groupMatchesByPhase(state.matches);
    var anyVisible = false;

    groups.forEach(function(g){
      var visibleInPhase = g.matches.filter(function(m){ return visibleIds[m.id]; });
      if (visibleInPhase.length === 0) return;
      anyVisible = true;

      var participants = phaseParticipantCount(g.matches);
      var completedInPhase = g.matches.filter(function(m){ return m.status === 'completed'; }).length;
      var isComplete = completedInPhase === g.matches.length;

      var header = el('div', {class:'phase-header'});
      header.appendChild(el('div', {class:'phase-title'}, ['PHASE ' + g.phase]));
      header.appendChild(el('div', {class:'phase-status' + (isComplete ? ' complete' : '')}, [
        isComplete ? 'Completed · ' + participants + '/' + state.players.length + ' players participated'
                   : participants + '/' + state.players.length + ' players participated · ' + completedInPhase + '/' + g.matches.length + ' played'
      ]));
      scroll.appendChild(header);

      var grid = el('div', {class:'match-grid'});
      visibleInPhase.forEach(function(m){ grid.appendChild(renderMatchCard(m)); });
      scroll.appendChild(grid);
    });

    if (!anyVisible){
      scroll.appendChild(el('div', {class:'empty-state'}, [
        el('div', {class:'big'}, ['🏸']),
        el('div', {}, ['No matches to show here.'])
      ]));
    }

    panel.appendChild(scroll);
    return panel;
  }

  function teamChip(playerIds, sideClass){
    var block = el('div', {class:'team-block ' + sideClass});
    playerIds.forEach(function(pid){
      var p = playerById(pid);
      var chip = el('div', {class:'player-chip'});

  function renderMatchCard(m){
    var card = el('div', {class:'match-card' + (m.status === 'completed' ? ' completed' : '')});

    var head = el('div', {class:'match-card-head'});
    head.appendChild(el('div', {class:'match-num'}, ['MATCH ' + m.matchNumber]));
    head.appendChild(el('div', {class:'status-pill ' + m.status}, [m.status === 'completed' ? 'Completed' : 'Pending']));
    card.appendChild(head);

    var teamsRow = el('div', {class:'teams-row'});
    teamsRow.appendChild(teamChip(m.team1, 'team1'));
    teamsRow.appendChild(el('div', {class:'vs-mark'}, ['VS']));
    teamsRow.appendChild(teamChip(m.team2, 'team2'));
    card.appendChild(teamsRow);

    var s1Val = m.score1 === null || m.score1 === undefined ? '' : m.score1;
    var s2Val = m.score2 === null || m.score2 === undefined ? '' : m.score2;
    var t1Winner = m.status === 'completed' && Number(m.score1) > Number(m.score2);
    var t2Winner = m.status === 'completed' && Number(m.score2) > Number(m.score1);

    var scoreRow = el('div', {class:'score-row'});
    var leftBox = el('div', {class:'score-box left'});
    var input1 = el('input', {type:'number', min:'0', class:'score-input' + (t1Winner ? ' winner' : ''), placeholder:'—'});
    input1.value = s1Val;
    leftBox.appendChild(input1);
    scoreRow.appendChild(leftBox);
    scoreRow.appendChild(el('div', {class:'dash'}, ['–']));
    var rightBox = el('div', {class:'score-box right'});
    var input2 = el('input', {type:'number', min:'0', class:'score-input' + (t2Winner ? ' winner' : ''), placeholder:'—'});
    input2.value = s2Val;
    rightBox.appendChild(input2);
    scoreRow.appendChild(rightBox);
    card.appendChild(scoreRow);

    var actions = el('div', {class:'match-actions'});
    if (m.status === 'completed'){
      actions.appendChild(el('button', {class:'btn btn-outline btn-sm', onclick:function(){
        m.score1 = null; m.score2 = null; m.status = 'pending';
        render();
      }}, ['Edit Score']));
    } else {
      actions.appendChild(el('button', {class:'btn btn-primary btn-sm', onclick:function(){
        var v1 = input1.value.trim(), v2 = input2.value.trim();
        if (v1 === '' || v2 === '' || isNaN(Number(v1)) || isNaN(Number(v2))){
          showToast('Enter both scores to save');
          return;
        }
        if (Number(v1) === Number(v2)){
          showToast("Badminton matches can't end in a tie");
          return;
        }
        m.score1 = Number(v1); m.score2 = Number(v2); m.status = 'completed';
        render();
        showToast('Match ' + m.matchNumber + ' saved');
      }}, ['Save Score']));
    }
    card.appendChild(actions);

    return card;
  }

  var BRACKET_CARD_H = 172;   // fixed match-card height (px) — every card is this tall so
  var BRACKET_BASE_GAP = 32;  // spacing math below stays exact regardless of content
  var BRACKET_COL_GAP = 72;   // horizontal space reserved between round columns for connectors

  function currentTourneyRoundLabel(){
    var m = state.bracket.matches;
    for (var r = 0; r < state.bracket.rounds; r++){
      var roundMatches = m.filter(function(x){ return x.round === r; });
      var unfinished = roundMatches.some(function(x){ return x.status === 'pending' || x.status === 'waiting'; });
      if (unfinished) return roundMatches[0].roundLabel;
    }
    return isTourneyChampionDecided() ? 'Final' : 'Final';
  }

  function scrollBracketToRound(r){
    var scroller = document.querySelector('.bracket-scroller-outer');
    var col = document.querySelector('.bracket-col[data-round="' + r + '"]');
    if (scroller && col) scroller.scrollTo({left: Math.max(0, col.offsetLeft - 20), behavior: 'smooth'});
  }

  // Requirement #8: draws real elbow connectors between a match and wherever
  // its winner advances to, measured from actual rendered positions (robust
  // no matter how the content inside a card wraps).
  function drawBracketConnectors(){
    var scroller = document.querySelector('.bracket-scroller-outer');
    var svg = document.querySelector('.bracket-connectors');
    if (!scroller || !svg || !state.bracket) return;
    var inner = scroller.querySelector('.bracket-scroller');
    if (!inner) return;
    var W = inner.scrollWidth, H = inner.scrollHeight;
    svg.setAttribute('width', W);
    svg.setAttribute('height', H);
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    var baseRect = inner.getBoundingClientRect();
    function rectOf(elm){
      var r = elm.getBoundingClientRect();
      return {left: r.left - baseRect.left, top: r.top - baseRect.top, right: r.right - baseRect.left, bottom: r.bottom - baseRect.top};
    }
    var paths = [];
    state.bracket.matches.forEach(function(m){
      if (!m.nextMatchId) return;
      var srcEl = scroller.querySelector('.bracket-match[data-match-id="' + m.id + '"]');
      var tgtEl = scroller.querySelector('.bracket-match[data-match-id="' + m.nextMatchId + '"]');
      if (!srcEl || !tgtEl) return;
      var sr = rectOf(srcEl), tr = rectOf(tgtEl);
      var y1 = sr.top + sr_height(sr) / 2;
      var y2 = tr.top + sr_height(tr) / 2;
      var x1 = sr.right, x2 = tr.left;
      var midX = (x1 + x2) / 2;
      var dashed = m.status !== 'completed' && m.status !== 'bye';
      paths.push('<path d="M ' + x1 + ' ' + y1 + ' H ' + midX + ' V ' + y2 + ' H ' + x2 + '" class="connector-line' + (dashed ? ' pending' : '') + '"/>');
    });
    // Final -> Champion box connector
    var finalMatch = state.bracket.matches[state.bracket.matches.length - 1];
    var finalEl = scroller.querySelector('.bracket-match[data-match-id="' + finalMatch.id + '"]');
    var champEl = scroller.querySelector('.champion-slot');
    if (finalEl && champEl){
      var fr = rectOf(finalEl), cr = rectOf(champEl);
      var fy = fr.top + sr_height(fr) / 2, cy = cr.top + sr_height(cr) / 2;
      var fx = fr.right, cx = cr.left, fMid = (fx + cx) / 2;
      paths.push('<path d="M ' + fx + ' ' + fy + ' H ' + fMid + ' V ' + cy + ' H ' + cx + '" class="connector-line' + (isTourneyChampionDecided() ? '' : ' pending') + '"/>');
    }
    svg.innerHTML = paths.join('');
    function sr_height(r){ return r.bottom - r.top; }
  }

  function renderBracketVisual(){
    var outer = el('div', {class:'bracket-scroller-outer'});
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'bracket-connectors');
    outer.appendChild(svg);
    var scroller = el('div', {class:'bracket-scroller'});

    for (var r = 0; r < state.bracket.rounds; r++){
      var roundMatches = state.bracket.matches.filter(function(m){ return m.round === r; });
      var col = el('div', {class:'bracket-col', 'data-round': String(r)});
      col.appendChild(el('div', {class:'bracket-col-title'}, [roundMatches[0].roundLabel]));
      var innerWrap = el('div', {class:'bracket-col-matches'});
      var P = BRACKET_CARD_H + BRACKET_BASE_GAP;
      roundMatches.forEach(function(m, j){
        var marginTop = j === 0
          ? P * 0.5 * (Math.pow(2, r) - 1)
          : P * Math.pow(2, r) - BRACKET_CARD_H;
        var cardWrap = renderBracketMatchCard(m);
        cardWrap.style.marginTop = Math.round(marginTop) + 'px';
        innerWrap.appendChild(cardWrap);
      });
      col.appendChild(innerWrap);
      scroller.appendChild(col);
    }

    // Requirement #3: a dedicated CHAMPION column completes the visual flow.
    var champCol = el('div', {class:'bracket-col champion-col', 'data-round':'champion'});
    champCol.appendChild(el('div', {class:'bracket-col-title'}, ['Champion']));
    var champWrap = el('div', {class:'bracket-col-matches champion-col-matches'});
    var champId = tourneyChampionId();
    var champBox = el('div', {class:'champion-slot' + (champId ? ' decided' : '')});
    if (champId){
      var champ = competitorById(champId);
      champBox.appendChild(el('div', {class:'champion-trophy'}, ['\uD83C\uDFC6']));
      champBox.appendChild(el('div', {class:'champion-name'}, [
        el('span', {class:'dot', style:'background:' + champ.color + ';'}), ' ' + champ.label
      ]));
      champBox.appendChild(el('div', {class:'champion-tag'}, ['CHAMPION']));
    } else {
      champBox.appendChild(el('div', {class:'champion-trophy dim'}, ['\uD83C\uDFC6']));
      champBox.appendChild(el('div', {class:'champion-name tbd'}, ['To be decided']));
    }
    champWrap.appendChild(champBox);
    champCol.appendChild(champWrap);
    scroller.appendChild(champCol);

    outer.appendChild(scroller);
    requestAnimationFrame(drawBracketConnectors);
    return outer;
  }

  function bracketCompetitorRow(compId, isWinner, score, mirrored){
    var comp = competitorById(compId);
    var row = el('div', {class:'bracket-competitor' + (isWinner ? ' winner' : '') + (mirrored ? ' mirrored' : '')});
    var dotEl = comp ? el('span', {class:'dot', style:'background:' + comp.color + ';'}) : null;
    var nameEl = comp
      ? el('span', {class:'bracket-competitor-name'}, [comp.label])
      : el('span', {class:'bracket-competitor-name tbd'}, ['TBD']);
    var scoreEl = (score !== null && score !== undefined) ? el('span', {class:'bracket-score'}, [String(score)]) : null;
    if (mirrored){
      // Requirement: in a side-by-side "VS" row, each score sits next to the
      // VS marker with the name pushed to the outer edge — the right-hand
      // side is a mirror image of the left, not a plain copy of it.
      if (scoreEl) row.appendChild(scoreEl);
      row.appendChild(nameEl);
      if (dotEl) row.appendChild(dotEl);
    } else {
      if (dotEl) row.appendChild(dotEl);
      row.appendChild(nameEl);
      if (scoreEl) row.appendChild(scoreEl);
    }
    return row;
  }

  function renderBracketMatchCard(m){
    var card = el('div', {class:'bracket-match status-' + m.status, 'data-match-id': m.id});
    var top = el('div', {class:'bracket-match-top'});
    top.appendChild(el('div', {class:'bracket-match-num'}, ['Match ' + (m.round+1) + '.' + (m.position+1)]));
    if (m.status === 'pending') top.appendChild(el('div', {class:'active-badge'}, ['\u25CF READY']));
    card.appendChild(top);

    if (m.status === 'bye'){
      card.appendChild(bracketCompetitorRow(m.winner, true, null));
      card.appendChild(el('div', {class:'bye-line'}, ['BYE \u2192 ADVANCES']));
      return card;
    }

    card.appendChild(bracketCompetitorRow(m.competitor1, m.status === 'completed' && m.winner === m.competitor1, m.status === 'completed' ? m.score1 : null));
    card.appendChild(bracketCompetitorRow(m.competitor2, m.status === 'completed' && m.winner === m.competitor2, m.status === 'completed' ? m.score2 : null));

    if (m.status === 'waiting'){
      card.appendChild(el('div', {class:'bracket-waiting'}, ['Awaiting previous round']));
    } else if (m.status === 'pending'){
      var row = el('div', {class:'bracket-score-entry'});
      var in1 = el('input', {type:'number', min:'0', class:'score-input', placeholder:'\u2014'});

  /* ---------- 3. Tournament standings — full-width detailed table ---------- */
  function tourneyFinishRank(f){
    var order = {'Champion':0,'Runner-up':1,'Semifinalist':2,'Quarterfinalist':3};
    if (order.hasOwnProperty(f)) return order[f];
    if (f === 'Active') return 50;
    var n = parseInt((f||'').replace('Round of ',''), 10);
    return isNaN(n) ? 99 : (100 - n);
  }
  function rankedTourneyCompetitors(){
    var finish = computeTourneyFinish();
    var stats = computeTourneyStats();
    var comps = getTourneyCompetitors();
    return comps.slice().sort(function(a,b){
      var ra = tourneyFinishRank(finish[a.id]), rb = tourneyFinishRank(finish[b.id]);
      if (ra !== rb) return ra - rb;
      return (stats[b.id].wins - stats[a.id].wins) || ((stats[b.id].pf - stats[b.id].pa) - (stats[a.id].pf - stats[a.id].pa));
    });
  }

  /* ---------- 4. Player / team performance cards ---------- */
  function computeLongestWinStreak(compId){
    // Uses round order as a chronological proxy (matches don't carry timestamps).
    var ordered = state.bracket.matches
      .filter(function(m){ return m.status === 'completed' && (m.competitor1 === compId || m.competitor2 === compId); })
      .sort(function(a,b){ return a.round - b.round || a.position - b.position; });
    var best = 0, cur = 0;
    ordered.forEach(function(m){
      if (m.winner === compId){ cur++; best = Math.max(best, cur); } else cur = 0;
    });
    return best;
  }

  /* ---------- 7. Tournament analytics — only shown once meaningful ---------- */
  function computeTourneyAnalytics(){
    var completed = state.bracket.matches.filter(function(m){ return m.status === 'completed'; });
    if (!completed.length) return null;
    var totalPoints = 0, highest = completed[0], closest = completed[0], largestDiff = completed[0];
    completed.forEach(function(m){
      var pts = m.score1 + m.score2;
      var diff = Math.abs(m.score1 - m.score2);
      totalPoints += pts;
      if (pts > highest.score1 + highest.score2) highest = m;
      if (diff < Math.abs(closest.score1 - closest.score2)) closest = m;
      if (diff > Math.abs(largestDiff.score1 - largestDiff.score2)) largestDiff = m;
    });
    var stats = computeTourneyStats();
    var comps = getTourneyCompetitors();
    var mostWins = null, bestWinPct = null, longestStreak = null, bestStreakVal = -1;
    comps.forEach(function(c){
      var s = stats[c.id];
      if (!s.played) return;
      if (!mostWins || s.wins > stats[mostWins.id].wins) mostWins = c;
      var pct = s.wins / s.played;
      if (!bestWinPct || pct > stats[bestWinPct.id].wins / stats[bestWinPct.id].played) bestWinPct = c;
      var streak = computeLongestWinStreak(c.id);
      if (streak > bestStreakVal){ bestStreakVal = streak; longestStreak = c; }
    });
    return {
      totalMatches: completed.length,
      avgPoints: Math.round(totalPoints / completed.length * 10) / 10,
      highest: highest, closest: closest, largestDiff: largestDiff,
      mostWins: mostWins, bestWinPct: bestWinPct, longestStreak: longestStreak, longestStreakVal: bestStreakVal
    };
  }

  function renderTourneyAnalyticsSection(){
    var section = el('section', {class:'panel', id:'tourney-analytics'});
    section.appendChild(el('h2', {}, ['Tournament Analytics']));
    var a = computeTourneyAnalytics();
    if (!a || a.totalMatches < 2){
      section.appendChild(el('div', {class:'empty-state'}, [el('div', {class:'big'}, ['\uD83D\uDCCA']), el('div', {}, ['Play a few more matches to unlock tournament analytics.'])]));
      return section;
    }
    var grid = el('div', {class:'analytics-grid'});
    grid.appendChild(analyticsCard('Total Matches Played', String(a.totalMatches)));
    grid.appendChild(analyticsCard('Average Points / Match', String(a.avgPoints)));
    grid.appendChild(analyticsCard('Highest Scoring Match', matchSummary(a.highest)));
    grid.appendChild(analyticsCard('Closest Match', matchSummary(a.closest)));
    grid.appendChild(analyticsCard('Largest Point Difference', matchSummary(a.largestDiff)));
    if (a.mostWins) grid.appendChild(analyticsCard('Most Wins', competitorById(a.mostWins.id).label));
    if (a.bestWinPct) grid.appendChild(analyticsCard('Highest Win Rate', competitorById(a.bestWinPct.id).label));
    if (a.longestStreak && a.longestStreakVal > 1) grid.appendChild(analyticsCard('Longest Win Streak', competitorById(a.longestStreak.id).label + ' (' + a.longestStreakVal + ')'));
    section.appendChild(grid);
    return section;
  }
  function matchSummary(m){
    var c1 = competitorById(m.competitor1), c2 = competitorById(m.competitor2);
    return c1.label + ' ' + m.score1 + '\u2013' + m.score2 + ' ' + c2.label;

      card.appendChild(summary);
    }

    var actions = el('div', {class:'modal-actions'});
    actions.appendChild(el('button', {class:'btn btn-ghost', onclick:function(){ importPreview = null; render(); }}, ['Cancel']));
    actions.appendChild(el('button', {class:'btn btn-primary', onclick:function(){
      if (importPreview.kind === 'backup'){
        importPreview.records.forEach(function(t){
          t.id = generateId();
          saveTournamentRecord(t);
        });
        var count = importPreview.records.length;
        importPreview = null;
        managerOpen = true;
        render();
        showToast('Imported ' + count + ' tournament' + (count === 1 ? '' : 's'));
      } else {
        var t2 = importPreview.record;
        t2.id = generateId();
        saveTournamentRecord(t2);
        importPreview = null;
        openTournament(t2.id);
      }
    }}, ['Import']));
    card.appendChild(actions);

    backdrop.appendChild(card);
    return backdrop;
  }

  /* ============================================================
     SHARE STATISTICS IMAGE MODAL
  ============================================================ */
  function renderShareImageModal(){
    var backdrop = el('div', {class:'modal-backdrop', onclick:function(e){
      if (e.target === backdrop){ shareImageModalOpen = false; render(); }
    }});
    var card = el('div', {class:'modal-card'});
    card.appendChild(el('h3', {}, ['🖼 Share Statistics']));
    card.appendChild(el('p', {}, ['A shareable image of the current standings and highlights — ready for WhatsApp, Instagram, or any messaging app.']));

    var preview = el('div', {class:'share-image-preview'});
    preview.appendChild(el('img', {src: shareImageDataUrl, alt:'Tournament statistics'}));
    card.appendChild(preview);

    var actions = el('div', {class:'modal-actions'});
    actions.appendChild(el('button', {class:'btn btn-ghost', onclick:function(){ shareImageModalOpen = false; render(); }}, ['Close']));

    var filename = 'Shuttle-Draw-' + toFilenameSegment(state.name || 'Tournament') + '-Stats.png';
    var canShareFiles = !!(navigator.share && navigator.canShare && (function(){
      try{ return navigator.canShare({files:[new File([new Blob()], 'x.png', {type:'image/png'})]}); }catch(e){ return false; }
    })());

    if (canShareFiles){
      actions.appendChild(el('button', {class:'btn btn-primary', onclick:function(){
        shareImageCanvasRef.toBlob(function(blob){
          var file = new File([blob], filename, {type:'image/png'});
          navigator.share({files:[file], title: state.name || 'Shuttle Draw', text:'Tournament statistics'}).catch(function(){});
        }, 'image/png');
      }}, ['Share']));
    }
    actions.appendChild(el('button', {class:'btn btn-cork', onclick:function(){
      shareImageCanvasRef.toBlob(function(blob){ downloadImageBlob(blob, filename); }, 'image/png');
    }}, ['Download PNG']));
    card.appendChild(actions);

    backdrop.appendChild(card);
    return backdrop;
  }

  /* ============================================================
     DUPLICATE CHOICE MODAL
  ============================================================ */
  function renderDuplicateModal(){
    var id = duplicatePromptId;
    var backdrop = el('div', {class:'modal-backdrop', onclick:function(e){
      if (e.target === backdrop){ duplicatePromptId = null; render(); }
    }});
    var card = el('div', {class:'modal-card'});
    card.appendChild(el('h3', {}, ['Duplicate tournament']));
    card.appendChild(el('p', {}, ['Keep the players and match schedule, and choose whether to carry the scores over.']));
    var actions = el('div', {class:'modal-actions'});
    actions.appendChild(el('button', {class:'btn btn-ghost', onclick:function(){ duplicatePromptId = null; render(); }}, ['Cancel']));
    actions.appendChild(el('button', {class:'btn btn-outline', onclick:function(){
      duplicatePromptId = null;
      var rec = duplicateTournament(id, false);
      render();
      if (rec) showToast('Duplicated as "' + rec.name + '" with scores cleared');
    }}, ['Duplicate as New Session']));
    actions.appendChild(el('button', {class:'btn btn-primary', onclick:function(){
      duplicatePromptId = null;
      var rec = duplicateTournament(id, true);
      render();
      if (rec) showToast('Duplicated "' + rec.name + '" with scores');
    }}, ['Duplicate with Scores']));
    card.appendChild(actions);
    backdrop.appendChild(card);
    return backdrop;
  }

  /* ============================================================
     CONFIRM MODAL
  ============================================================ */
  function confirmAction(opts){
    pendingAction = opts;
    render();
  }

  function renderConfirmModal(){
    var opts = pendingAction;
    var backdrop = el('div', {class:'modal-backdrop', onclick:function(e){
      if (e.target === backdrop){ pendingAction = null; render(); }
    }});
    var card = el('div', {class:'modal-card'});
    card.appendChild(el('h3', {}, [opts.title]));
    card.appendChild(el('p', {}, [opts.body]));
    var actions = el('div', {class:'modal-actions'});
    actions.appendChild(el('button', {class:'btn btn-ghost', onclick:function(){
      pendingAction = null; render();
    }}, ['Cancel']));
    actions.appendChild(el('button', {class:'btn btn-primary', onclick:function(){
      var fn = opts.onConfirm;
      pendingAction = null;
      fn();
    }}, [opts.confirmLabel]));
    card.appendChild(actions);
    backdrop.appendChild(card);
    return backdrop;
  }

  /* ============================================================
     INIT
  ============================================================ */
  initApp();

})();
</script>
</body>
</html>
